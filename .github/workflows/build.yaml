name: CI/CD Build Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build and Test Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

  frontend-ci:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  ai-pipeline-ci:
    name: AI Pipeline CI (Python / UV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up UV
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'
          enable-cache: true

      - name: Sync AI Pipeline Dependencies
        run: |
          uv sync --project ai_pipeline

      - name: Run AI Pipeline Checks
        run: |
          make test
