[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Social Pulse AI Pipeline - GPU-ready feed ranking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "zstandard>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
train = "ai_pipeline.training.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
packages = [
    "ai_pipeline",
    "ai_pipeline.inference",
    "ai_pipeline.shared",
    "ai_pipeline.training",
]

[tool.setuptools.package-dir]
ai_pipeline = "."
