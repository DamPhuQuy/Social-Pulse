services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ai-pipeline:
    build: ./ai_pipeline
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      AI_PIPELINE_ENABLED: "true"
      AI_PIPELINE_MODEL_LOCATION: /app/model/model.json
      AI_PIPELINE_FEATURE_SCHEMA_VERSION: ${AI_PIPELINE_FEATURE_SCHEMA_VERSION:-v1}
      AI_PIPELINE_INFERENCE_DEVICE: cpu
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 4g
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      AI_PIPELINE_BASE_URL: http://ai-pipeline:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-pipeline:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
