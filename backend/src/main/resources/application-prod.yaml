spring:
  datasource:
    url: jdbc:${DB:postgresql}://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    repair-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      seedDemoData: false
  jpa:
    database: ${DB:postgresql}
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  version: 1.0.0

ai:
  pipeline:
    enabled: ${AI_PIPELINE_ENABLED:false}
    base-url: ${AI_PIPELINE_BASE_URL:http://ai-pipeline:8000}
    feature-schema-version: ${AI_PIPELINE_FEATURE_SCHEMA_VERSION:v1}

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
