spring:
  datasource:
    url: jdbc:postgresql://db:5432/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom app config — đọc từ env JWT_SECRET, fallback về dev key nếu không có
app:
  jwt:
    # Secret phải >= 32 ký tự (256 bit) cho HMAC-SHA256
    # Production: đặt JWT_SECRET trong env, không dùng fallback này
    secret: ${JWT_SECRET:dev-only-super-secret-key-for-socialpulse-2024}
    # 86400000ms = 24 giờ
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  version: 1.0.0